name: Lab 01 - CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "01-first-cicd-pipeline/**"
      - ".github/workflows/lab01-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "01-first-cicd-pipeline/**"
      - ".github/workflows/lab01-ci.yml"

defaults:
  run:
    working-directory: 01-first-cicd-pipeline

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
           name: test-results
           path: 01-first-cicd-pipeline/test-results.xml
  
